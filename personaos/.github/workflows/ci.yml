name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: personaos
          POSTGRES_PASSWORD: personaos
          POSTGRES_DB: personaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personaos -d personaos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: personaos/package-lock.json
      - working-directory: personaos
        run: npm ci
      - working-directory: personaos
        run: npm run db:generate
      - working-directory: personaos
        run: npm run lint
      - working-directory: personaos
        run: npm run typecheck
      - working-directory: personaos
        run: npm run test
      - working-directory: personaos
        run: npm run build
