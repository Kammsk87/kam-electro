services:
  postgres:
    image: postgres:16-alpine
    container_name: personaos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: personaos
      POSTGRES_PASSWORD: personaos
      POSTGRES_DB: personaos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personaos -d personaos"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2026-06-14T20-07-23Z
    container_name: personaos-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: personaos
      MINIO_ROOT_PASSWORD: personaos-secret
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
