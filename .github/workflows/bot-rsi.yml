name: Bot RSI Reversal (15m/1h)

on:
  workflow_dispatch:
  schedule:
    - cron: "4-59/5 * * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run RSI Reversal bot
        env:
          BOTALIN_SERVER_PROFILE: training
          BOTALIN_STRATEGY: rsi-reversal
          BOTALIN_USER_LOGIN: server-rsi
        run: node share/strategy-lab-7q4m2v/server-autobot.mjs --once
