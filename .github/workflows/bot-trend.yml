name: Bot Trend (EMA34/89)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run trend bot
        env:
          BOTALIN_SERVER_PROFILE: training
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BOTALIN_STRATEGY: trend
          BOTALIN_USER_LOGIN: server-trend
        run: node share/strategy-lab-7q4m2v/server-autobot.mjs --once
