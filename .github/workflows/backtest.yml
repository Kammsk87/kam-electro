name: Backtest All Strategies

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "Strategy to backtest (all / trend / pullback / scalping / rsi-reversal / breakout / vwap-reversion)"
        required: false
        default: "all"
  schedule:
    - cron: "0 3 * * 1"  # каждый понедельник в 03:00 UTC

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run backtest
        env:
          BOTALIN_SERVER_PROFILE: training
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BOTALIN_STRATEGY: ${{ inputs.strategy || 'all' }}
          BOTALIN_USER_LOGIN: backtest
        run: node share/strategy-lab-7q4m2v/server-autobot.mjs --backtest
