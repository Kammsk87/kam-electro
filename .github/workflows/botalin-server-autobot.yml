name: Bot All Strategies (координатор)

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

permissions:
  contents: read

jobs:
  paper-autobot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run all-strategies bot
        env:
          BOTALIN_SERVER_PROFILE: training
          BOTALIN_REMOTE_BACKEND: supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          BOTALIN_USER_LOGIN: server
        run: node share/strategy-lab-7q4m2v/server-autobot.mjs --once
