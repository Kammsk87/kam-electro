name: Botalin Server Autobot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  paper-autobot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Botalin server paper-autobot
        run: node share/strategy-lab-7q4m2v/server-autobot.mjs --once
